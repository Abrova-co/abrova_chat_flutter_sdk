name: abrova_chat_ecommerce_example
description: A comprehensive e-commerce example app demonstrating all AbrovaChat SDK features.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

  # AbrovaChat SDK packages
  abrova_chat:
    path: ../abrova_chat_core
  abrova_chat_ui:
    path: ../abrova_chat_ui
  abrova_push:
    hosted: https://center.abrova.ir/api/packages/abrova/pub
    version: ^0.1.13

  # UI dependencies
  cached_network_image: ^3.4.1
  intl: ^0.19.0

  # File handling (for upload example)
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  http: ^1.2.0
  path: ^1.9.0

# abrova_chat_ui (published) depends on abrova_chat from Abrova Center. This example
# builds against the local core and UI kit, so point both at the paths here.
dependency_overrides:
  abrova_chat:
    path: ../abrova_chat_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
